<!DOCTYPE html>
<html>
<head>

<title>SkillHub - Logged Out</title>

<style>

body{
margin:0;
font-family:Segoe UI, Arial;
background:#eef2f7;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.box{
background:white;
padding:50px;
border-radius:14px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,0.12);
animation:fadeIn 0.6s ease-in-out;
}

h1{
color:#2563eb;
margin-bottom:10px;
}

.subtitle{
font-size:14px;
color:#666;
margin-bottom:20px;
}

p{
color:#555;
font-size:15px;
}

button{
margin-top:25px;
padding:12px 22px;
border:none;
background:#2563eb;
color:white;
border-radius:8px;
cursor:pointer;
font-size:14px;
transition:0.2s;
}

button:hover{
background:#1e40af;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="box">

<h1>SkillHub</h1>
<div class="subtitle">You have successfully logged out</div>

<p>
Thank you for being part of our learning community.
<br>
Keep sharing knowledge and growing together.
</p>

<p><b>Happy Learning 🚀</b></p>

<button onclick="location.href='index.html'">
Return to SkillHub
</button>

</div>

</body>
</html>
